# Include INSIDE the node FQDN's existing HTTPS server {} on port 443.
# These locations do not change the node's existing Wings proxy routes.
location ^~ /fastdl/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    proxy_buffering off;
    # Paths contain public bearer tokens. Avoid logging them in access logs.
    access_log off;
    error_log /dev/null crit;
    limit_except GET HEAD { deny all; }
}

location ^~ /gmod-toolkit-api/ {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 40s;
    client_max_body_size 64k;
    access_log off;
    limit_except POST { deny all; }
}
