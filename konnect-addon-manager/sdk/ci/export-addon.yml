# Copy to .github/workflows/export-addon.yml in YOUR ADDON repository.
# Replace the manager repository and reviewed 40-character source commit below.
# This example assumes the self-contained deployment package lives in addon/.
name: Export addon release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed manager tooling
        uses: actions/checkout@v4
        with:
          repository: YOUR_ORG/Konnect-Hosting-Panel-Custom-Addons
          ref: REPLACE_WITH_REVIEWED_40_CHARACTER_COMMIT
          path: _manager
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build optional addon assets
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm ci
          npm run build
      # Build tooling/dependencies remain outside addon/. Asset hashes in the
      # manifest must match the built bytes; the exporter never rewrites them.
      - name: Validate and export
        run: |
          mkdir -p dist
          php _manager/konnect-addon-manager/sdk/bin/addon.php validate addon
          php _manager/konnect-addon-manager/sdk/bin/addon.php export addon --output=dist/addon.zip
          cd dist
          sha256sum -c addon.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: addon-package
          path: |
            dist/addon.zip
            dist/addon.zip.sha256
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/addon.zip
            dist/addon.zip.sha256
